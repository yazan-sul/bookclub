version: '3.8'

services:
  app:
    build: .
    ports:
      - "4567:4567"
    environment:
      - BOOKCLUB_MDB_STRING=mongodb://mongo:27017/bookclub
      - NYT_API_TOKEN=your_nyt_api_token
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: